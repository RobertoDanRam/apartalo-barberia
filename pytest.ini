[pytest]
testpaths = tests
pythonpath = src
addopts = -v --strict-markers --import-mode=importlib
markers = 
    unitaria: pruebas unitarias nacidas del TDD
    aceptacion: pruebas de aceptación que vienen de los escenarios BDD
    regresion: pruebas que atrapan un defecto que ya ocurrió
    rnf: pruebas de requisitos no funcionales

